name: Bug Report
description: Report a reproducible issue with Axiom.
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      content: |
        Thanks for taking the time to file a bug report. Please fill in the
        sections below — the more detail, the faster we can reproduce.

        Note: This repo is a public mirror re-exported from a private
        upstream on every release. Pull requests are not accepted; please
        file issues only.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
        - Windows
      validations:
        required: true
  - type: input
    id: version
    attributes:
      label: Axiom version
      placeholder: "v0.6.1"
      validations:
        required: true
  - type: input
    id: provider
    attributes:
      label: Provider / Model
      placeholder: "anthropic-compatible / claude-sonnet-4.5, etc."
      validations:
        required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      validations:
        required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      validations:
        required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      validations:
        required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      placeholder: "Paste the relevant section of the session log, or attach an image."
      validations:
        required: false